services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-NUARTE}"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY:?Defina APP_KEY no arquivo .env}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-nuartemo}"
      DB_USERNAME: "${DB_USERNAME:-nuartemo}"
      DB_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}"
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SUAP_CLIENT_ID: "${SUAP_CLIENT_ID:-}"
      SUAP_CLIENT_SECRET: "${SUAP_CLIENT_SECRET:-}"
      SUAP_SCOPE: "${SUAP_SCOPE:-}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-nuartemo}"
      MYSQL_USER: "${DB_USERNAME:-nuartemo}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
